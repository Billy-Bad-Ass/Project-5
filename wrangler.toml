name = "bba-growth-os"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Single environment on purpose.
#
# Wrangler does not inherit bindings into a named [env.x]: d1_databases,
# kv_namespaces, r2_buckets, queues, durable_objects and triggers all have to be
# repeated per environment or they silently vanish. Duplicating them drifts, and
# a production Worker with no queue and no crons looks healthy while doing
# nothing at all. One environment cannot have that problem.
#
# Local development runs against simulated resources via `npm run dev`, which
# overrides BBA_ENV, so nothing here needs a second copy.
workers_dev = true

# ---------------------------------------------------------------------------
# Custom domains on bbanetwork.org.
#
# ops. serves the console, the admin API, media and the Stripe webhook.
# go.  serves tracked click-through links, so ad destinations are on our own
#      domain rather than a workers.dev subdomain.
#
# Both point at this one Worker. `custom_domain = true` makes Wrangler create
# the DNS record and the certificate on deploy, so there is nothing to click in
# the dashboard. The apex bbanetwork.org is left alone for the marketing site.
# ---------------------------------------------------------------------------
[[routes]]
pattern = "ops.bbanetwork.org"
custom_domain = true

[[routes]]
pattern = "go.bbanetwork.org"
custom_domain = true

# ---------------------------------------------------------------------------
# Non-secret configuration. Secrets go through `wrangler secret put` (see
# scripts/push-secrets.sh) and never into this file.
# ---------------------------------------------------------------------------
[vars]
BBA_ENV = "production"
BBA_BUSINESS_NAME = "BBA Network"
BBA_BUSINESS_EMAIL = "bbacentralworkspace@gmail.com"
# Master kill switch. While true no agent may mutate a live ad account or
# publish a post; every mutation is written to the decision log instead.
DRY_RUN = "true"
# Nothing reaches a live account without a human approving it first.
REQUIRE_HUMAN_APPROVAL = "true"
# Hard ceiling in minor units (cents) across every ad channel per UTC day.
DAILY_SPEND_CAP_CENTS = "2500"
# A creative must score at least this on the editorial gate (0-100) to ship.
EDITORIAL_MIN_SCORE = "78"
# Platforms pull creative over the public internet, so this has to be an origin
# they can actually reach.
PUBLIC_BASE_URL = "https://ops.bbanetwork.org"
# Base for tracked ad links built by GET /go/<offer-slug>.
LINK_BASE_URL = "https://go.bbanetwork.org"
LOG_LEVEL = "info"

[[d1_databases]]
binding = "DB"
database_name = "bba-growth-os"
database_id = "8150c1a7-323f-46d6-a683-49cba96d8c80"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "CONFIG"
id = "dbfd1330ba83422dbe82a3fc1d8ede7e"

[[kv_namespaces]]
binding = "CACHE"
id = "d8523f9806ed42129883c2184d89376a"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "bba-growth-os-media"

[[queues.producers]]
binding = "JOBS"
queue = "bba-growth-os-jobs"

[[queues.consumers]]
queue = "bba-growth-os-jobs"
max_batch_size = 10
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "bba-growth-os-jobs-dlq"

[[durable_objects.bindings]]
name = "CAMPAIGN_ROOM"
class_name = "CampaignRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CampaignRoom"]

# ---------------------------------------------------------------------------
# Automatic orchestration. Every agent cycle in the system starts from one of
# these. See src/orchestrator/schedule.ts for what each cron maps to.
# ---------------------------------------------------------------------------
[triggers]
crons = [
  "*/5 * * * *",   # tick:      drain due work, publish scheduled posts, health
  "15 * * * *",    # hourly:    pull metrics from every connected channel
  "30 */6 * * *",  # optimize:  reallocate budget, pause losers
  "0 13 * * *",    # daily:     analyst report, replan, refill creative pipeline
  "0 14 * * 1"     # weekly:    portfolio review and strategy reset
]

[observability]
enabled = true
