name: inspect

# Read-only look at the live system, on demand.
#
# The point of running this in Actions rather than locally is that the workflow
# already holds a Cloudflare API token, so anyone who can read the repo's
# Actions logs can see what the agents are doing without a CLI, a dashboard
# login, or network access to the Worker.
#
# Every statement here is a SELECT. Nothing in this workflow can change state.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days of history to include'
        required: false
        default: '2'

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DAYS: ${{ inputs.days || '2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Orchestrator runs
        run: |
          npx wrangler d1 execute bba-growth-os --remote --json --command \
            "SELECT trigger, cron, status, started_at, finished_at, jobs_enqueued, summary
               FROM runs ORDER BY started_at DESC LIMIT 25"

      - name: Jobs
        run: |
          npx wrangler d1 execute bba-growth-os --remote --json --command \
            "SELECT agent, task, status, attempts, substr(COALESCE(error,''),1,160) AS error,
                    substr(COALESCE(result,''),1,200) AS result, created_at
               FROM jobs ORDER BY created_at DESC LIMIT 40"

      - name: Decisions
        run: |
          npx wrangler d1 execute bba-growth-os --remote --json --command \
            "SELECT agent, action, channel, outcome, substr(rationale,1,200) AS rationale, created_at
               FROM decisions ORDER BY created_at DESC LIMIT 40"

      - name: Open incidents
        run: |
          npx wrangler d1 execute bba-growth-os --remote --json --command \
            "SELECT severity, code, message, created_at
               FROM incidents WHERE resolved_at IS NULL ORDER BY created_at DESC LIMIT 25"

      # Counts last so the summary is the final thing in the log.
      - name: Summary
        run: |
          npx wrangler d1 execute bba-growth-os --remote --json --command \
            "SELECT
               (SELECT COUNT(*) FROM runs)                                   AS runs,
               (SELECT COUNT(*) FROM runs WHERE status='ok')                 AS runs_ok,
               (SELECT COUNT(*) FROM runs WHERE status='failed')             AS runs_failed,
               (SELECT COUNT(*) FROM jobs)                                   AS jobs,
               (SELECT COUNT(*) FROM jobs WHERE status='done')               AS jobs_done,
               (SELECT COUNT(*) FROM jobs WHERE status='failed')             AS jobs_failed,
               (SELECT COUNT(*) FROM decisions)                              AS decisions,
               (SELECT COUNT(*) FROM incidents WHERE resolved_at IS NULL)    AS open_incidents,
               (SELECT COUNT(*) FROM accounts)                               AS accounts,
               (SELECT COUNT(*) FROM offers WHERE status='active')           AS active_offers,
               (SELECT COUNT(*) FROM creatives)                              AS creatives,
               (SELECT COUNT(*) FROM posts)                                  AS posts,
               (SELECT COALESCE(SUM(amount_cents),0) FROM spend_ledger)      AS spend_cents_all_time,
               (SELECT MAX(started_at) FROM runs)                            AS last_run_at"
