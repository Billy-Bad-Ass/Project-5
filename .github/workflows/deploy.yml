name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # `wrangler deploy` fails outright if a queue named in a producer or
      # consumer binding does not exist, and there is no create-if-missing flag.
      # Creating them here keeps provisioning in one place and makes a fresh
      # account deployable without anyone running a CLI by hand.
      #
      # `wrangler queues create` exits non-zero when the queue already exists,
      # which is the normal case on every deploy after the first, so failure is
      # tolerated here. A genuinely bad token still fails loudly one step later.
      - name: Ensure queues exist
        run: |
          npx wrangler queues create bba-growth-os-jobs || echo "jobs queue already exists"
          npx wrangler queues create bba-growth-os-jobs-dlq || echo "dlq already exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Migrations run before the deploy so the new code never meets an old schema.
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply bba-growth-os --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A deployed Worker is not a running one. Every agent cycle starts from a
      # cron trigger, so verify the schedules Cloudflare actually registered
      # match the ones wrangler.toml declares — a deploy that lost them would
      # otherwise look green while the system does nothing, forever.
      - name: Verify cron triggers are registered
        run: node scripts/check-crons.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
